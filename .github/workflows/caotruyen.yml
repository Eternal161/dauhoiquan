name: 📖 Auto Cào Truyện Tranh

on:
  schedule:
    # Chạy tự động 2 lần 1 ngày (00:00 và 12:00 UTC, tức 7h sáng và 19h tối giờ VN)
    - cron: '0 0,12 * * *'
  
  # Cục này cho phép bạn vào web GitHub bấm nút "Run workflow" chạy bằng tay bất cứ lúc nào
  workflow_dispatch:

jobs:
  run-bot-truyen:
    runs-on: ubuntu-latest

    steps:
    - name: Tải mã nguồn về Server
      uses: actions/checkout@v4

    - name: Cài đặt Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Cài đặt vũ khí cho Bot (Thư viện)
      run: |
        python -m pip install --upgrade pip
        pip install requests PyGithub playwright playwright-stealth
        playwright install chromium --with-deps

    - name: 🚀 Khởi động Bot Cào Truyện
      env:
        # Lấy chìa khóa Token từ Cài đặt bảo mật của Repo
        GH_TOKEN: ${{ secrets.GH_TOKEN }}
        # Đảm bảo kho lưu trữ đúng với kho bạn đang dùng (Sửa nếu cần)
        GH_REPO: 'Eternal161/dauhoiquan' 
      run: python caotruyen.py
